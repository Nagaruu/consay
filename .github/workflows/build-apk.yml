name: Build and Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autotag-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      # Tự động tăng version tag vN (v1 -> v2 -> v3) mỗi khi push lên nhánh main
      - name: Auto-tag vN (main only)
        id: autotag
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags origin || true
          MAX=$(git tag --list "v*" | sed 's/^v//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          if [ -z "$MAX" ]; then MAX=0; fi
          NEXT=$((MAX + 1))
          TAG="v$NEXT"
          echo "Current max tag: $MAX -> Creating tag $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping push"
          else
            git tag "$TAG" HEAD
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "num=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Resolve build version code
        id: ver
        run: |
          if [ -n "${{ steps.autotag.outputs.num }}" ]; then
            VCODE="${{ steps.autotag.outputs.num }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VCODE="${GITHUB_REF_NAME#v}"
          else
            VCODE="1"
          fi
          echo "Version Code: $VCODE"
          echo "vcode=$VCODE" >> "$GITHUB_OUTPUT"

      - name: Build APK with Release Keystore
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PappVersionCode=${{ steps.ver.outputs.vcode }} -PappVersionName="1.0.${{ steps.ver.outputs.vcode }}"

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/app-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.autotag.outputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ steps.autotag.outputs.tag || github.ref_name }}
          name: Cơn Say ${{ steps.autotag.outputs.tag || github.ref_name }}
          body: |
            Tự động phát hành bản build APK mới cho ứng dụng Cơn Say.
            - Version Code: ${{ steps.ver.outputs.vcode }}
            - Cam kết bảo mật, ký bởi keystore phát hành cố định.
          files: release-assets/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
